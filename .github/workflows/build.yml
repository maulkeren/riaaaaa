name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        working-directory: nexus-android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp nexus-android/app/build/outputs/apk/debug/app-debug.apk nexus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: nexus.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-build-${{ github.run_number }}
          name: Nexus build ${{ github.run_number }}
          files: nexus.apk
